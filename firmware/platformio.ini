; CP-100 firmware: ESP32-S3-DevKitC-1 N16R8 (16 MB QIO flash, 8 MB OPI PSRAM)
; Build:  pio run          Upload: pio run -t upload        Monitor: pio device monitor

[env:cp100]
; espressif32 6.9.0 = Arduino core 2.0.17 (ESP-IDF 4.4)
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = +<*> -<panel.cpp> -<display.cpp> -<leds.cpp>
extra_scripts = pre:tools/pre_build.py
lib_deps = bblanchon/ArduinoJson@6.21.5
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Serial uses the DevKit port labelled "UART". Set ARDUINO_USB_CDC_ON_BOOT=1 to use the "USB" port instead.
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -Wall
